<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061b35"><title>Grand Crown Admin</title><style>
:root{--navy:#061b35;--navy2:#0b2c55;--card:#0c2a50;--gold:#e2b84b;--gold2:#f4d77c;--line:#31577f;--muted:#b9c8d9;--green:#15b76d;--red:#ef4b4b;--orange:#f39a20}*{box-sizing:border-box}body{margin:0;background:#061b35;color:#fff;font-family:Inter,Arial,sans-serif}.shell{max-width:1200px;margin:auto;min-height:100vh}.top{background:#08264b;border-bottom:2px solid var(--gold);padding:14px 18px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;color:var(--gold2);font-size:24px}.sub{color:var(--muted);font-size:12px}.nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#06152b;border-bottom:1px solid #27496e}.nav button{white-space:nowrap;border:1px solid #365b81;background:#0a2749;color:#d7e3f0;border-radius:10px;padding:9px 11px}.nav button.active{background:var(--gold);color:#071a30}.main{padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:linear-gradient(145deg,#0c315b,#082244);border:1px solid #365e87;border-radius:17px;padding:15px}.stat .v{font-size:25px;font-weight:900;color:var(--gold2)}.stat .l{color:var(--muted);font-size:12px;margin-top:4px}.panel{background:#0b2a50;border:1px solid #355d86;border-radius:18px;padding:17px;margin:14px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:#071a30}.green{background:var(--green);color:#fff}.red{background:var(--red);color:#fff}.orange{background:var(--orange);color:#1b1406}.dark{background:#12375f;color:#fff;border:1px solid #4d7196}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #294d72;text-align:left;white-space:nowrap}th{color:var(--gold2);font-size:12px}.userrow{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #294d72;padding:12px 0}.badge{padding:4px 8px;border-radius:20px;background:#173b62;color:#d9e7f5;font-size:11px}.badge.green{background:#0e6842}.badge.red{background:#7d2525}.muted{color:var(--muted)}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login-card{width:min(420px,100%);background:#0b2a50;border:1px solid #3a628c;border-radius:22px;padding:24px}.input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #607995;margin:7px 0 11px;background:#f8fafc;color:#16263b}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:30}.modal.hide{display:none}.sheet{width:min(620px,100%);background:#f8fafc;color:#16263b;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}.close{float:right;border:0;background:none;font-size:24px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.notice{background:#eaf0f7;padding:11px;border-radius:10px;color:#22354b}.hide{display:none!important}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.main{padding:12px}.nav{padding:8px}.top{padding:12px}.brand{font-size:20px}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.stat .v{font-size:19px}.nav button{font-size:10px;padding:8px}.main h1{font-size:23px}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><h1 style="color:var(--gold2)">♛ GRAND CROWN</h1><p class="muted">Admin Dashboard</p><input id="au" class="input" value="admin" placeholder="Username"><input id="ap" class="input" type="password" placeholder="Password"><button class="btn primary" style="width:100%" onclick="login()">Sign In</button><p id="lm" class="muted"></p></div></div>
<div id="shell" class="shell hide"><header class="top"><div><div class="brand">♛ GRAND CROWN</div><div class="sub">Administrator Control Center</div></div><div class="toolbar"><button class="btn dark" onclick="location.reload()">Refresh</button><button class="btn dark" onclick="logout()">Log out</button></div></header><nav class="nav" id="nav"></nav><main class="main"><h1 id="title">Dashboard</h1><div id="page"></div></main></div>
<div id="userModal" class="modal hide"><div class="sheet"><button class="close" onclick="closeUser()">×</button><h2>Manage User</h2><div id="userInfo"></div><div class="actions"><button class="btn green" onclick="credit()">＋ Credit User</button><button class="btn red" onclick="debit()">− Debit User</button><button class="btn orange" onclick="banToggle()">◉ Ban / Unban</button><button class="btn red" onclick="deleteUser()">⌫ Delete User</button></div><hr><h3>Quick amount</h3><input id="actionAmount" class="input" type="number" placeholder="Amount in UGX"><button class="btn dark" onclick="closeUser()">Cancel</button></div></div>
<script>
const tabs=['Dashboard','Users','Deposits','Withdrawals','Products','Transactions','Referrals','Settings'];let currentUser=null;const $=id=>document.getElementById(id);async function api(u,o={}){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw d;return d}async function login(){try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('au').value,password:$('ap').value})});$('login').classList.add('hide');$('shell').classList.remove('hide');buildNav();openTab('Dashboard')}catch(e){$('lm').textContent=e.error||'Login failed'}}async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}function buildNav(){$('nav').innerHTML=tabs.map(t=>`<button data-t="${t}" onclick="openTab('${t}')">${t}</button>`).join('')}function active(t){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===t))}async function openTab(t){currentUser=null;active(t);$('title').textContent=t;$('page').innerHTML='<div class="panel">Loading…</div>';if(t==='Dashboard')return dashboard();if(t==='Users')return users();if(t==='Deposits')return deposits();if(t==='Withdrawals')return withdrawals();if(t==='Products')return products();if(t==='Transactions')return transactions();if(t==='Referrals')return referrals();if(t==='Settings')return settings()}
function money(n){return Number(n||0).toLocaleString()}function stat(v,l){return `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`}async function dashboard(){const d=await api('/api/admin/dashboard');$('page').innerHTML=`<div class="grid">${stat(d.users,'Total Users')}${stat(d.users,'Active Users')}${stat(d.products,'Active Plans')}${stat('UGX '+money(d.walletBalances),'Wallet Balances')}${stat('UGX '+money(d.totalDeposited),'Total Deposits')}${stat('UGX '+money(d.totalWithdrawn),'Total Withdrawals')}${stat(d.payments,'Pending Deposits')}${stat(d.withdrawals,'Pending Withdrawals')}</div><div class="panel"><h2>Earnings Overview</h2><p class="muted">Grand Crown platform activity and approval controls.</p><div class="toolbar"><button class="btn primary" onclick="openTab('Deposits')">Review Deposits</button><button class="btn dark" onclick="openTab('Withdrawals')">Review Withdrawals</button><button class="btn dark" onclick="openTab('Users')">Manage Users</button></div></div>`}
async function users(){const a=await api('/api/admin/users');$('page').innerHTML=`<div class="panel"><h2>Users</h2>${a.map(u=>`<div class="userrow"><div><b>${u.phone}</b><br><span class="muted">${u.id} · Ref: ${u.referralCode}</span><br><span class="badge ${u.banned?'red':'green'}">${u.banned?'Banned':'Active'}</span> <span class="badge">UGX ${money(u.wallet)}</span></div><button class="btn primary" onclick='openUser(${JSON.stringify(u)})'>Manage</button></div>`).join('')||'<p class="muted">No users.</p>'}</div>`}
function openUser(u){currentUser=u;$('userInfo').innerHTML=`<div class="notice"><b>${u.phone}</b><br>ID: ${u.id}<br>Wallet: <b>UGX ${money(u.wallet)}</b><br>Status: ${u.banned?'Banned':'Active'}</div>`;$('actionAmount').value='';$('userModal').classList.remove('hide')}function closeUser(){$('userModal').classList.add('hide');currentUser=null}async function userAction(action){const amount=Number($('actionAmount').value||0);try{await api('/api/admin/users/'+encodeURIComponent(currentUser.id)+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,amount})});closeUser();openTab('Users')}catch(e){alert(e.error||'Action failed')}}function credit(){userAction('credit')}function debit(){userAction('debit')}function banToggle(){userAction(currentUser.banned?'unban':'ban')}async function deleteUser(){if(confirm('Delete this user?'))userAction('delete')}
async function deposits(){const a=await api('/api/admin/payments');$('page').innerHTML=`<div class="panel"><h2>Deposits</h2>${a.map(x=>`<div class="userrow"><div><b>${x.productName}</b><br>User: ${x.userId}<br>UGX ${money(x.amount)} · ${x.method}<br>Reference: <b>${x.transactionId}</b><br><span class="badge">${x.status}</span></div>${x.status==='pending'?`<div class="toolbar"><button class="btn green" onclick="reviewPay('${x.id}','approve')">Approve</button><button class="btn red" onclick="reviewPay('${x.id}','reject')">Reject</button></div>`:''}</div>`).join('')||'<p class="muted">No deposits.</p>'}</div>`}async function reviewPay(id,action){await api('/api/admin/payments/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});openTab('Deposits')}
async function withdrawals(){const a=await api('/api/admin/withdrawals');$('page').innerHTML=`<div class="panel"><h2>Withdrawals</h2>${a.map(x=>`<div class="userrow"><div>User: ${x.userId}<br>Amount: <b>UGX ${money(x.amount)}</b><br>Fee: UGX ${money(x.fee)} · Net: UGX ${money(x.netAmount)}<br>${x.method} · ${x.phone}<br><span class="badge">${x.status}</span></div>${x.status==='pending'?`<div class="toolbar"><button class="btn green" onclick="reviewWd('${x.id}','approve')">Mark Paid</button><button class="btn red" onclick="reviewWd('${x.id}','reject')">Reject</button></div>`:''}</div>`).join('')||'<p class="muted">No withdrawals.</p>'}</div>`}async function reviewWd(id,action){await api('/api/admin/withdrawals/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});openTab('Withdrawals')}
async function products(){const a=await api('/api/admin/products');$('page').innerHTML=`<div class="panel"><h2>Products</h2><button class="btn primary" onclick="addProduct()">＋ Add Product</button><div class="tablewrap"><table><tr><th>Name</th><th>Price</th><th>Daily</th><th>Total</th><th>Days</th></tr>${a.map(x=>`<tr><td>${x.name}</td><td>UGX ${money(x.price)}</td><td>UGX ${money(x.daily)}</td><td>UGX ${money(x.total)}</td><td>${x.days}</td></tr>`).join('')}</table></div></div>`}async function addProduct(){const name=prompt('Product name');if(!name)return;const price=Number(prompt('Price'));const daily=Number(prompt('Daily'));const total=Number(prompt('Total'));const days=Number(prompt('Days'));await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price,daily,total,days})});openTab('Products')}
async function transactions(){const a=await api('/api/admin/transactions');$('page').innerHTML=`<div class="panel"><h2>Transactions</h2><div class="tablewrap"><table><tr><th>Type</th><th>User</th><th>Amount</th><th>Date</th></tr>${a.slice().reverse().map(x=>`<tr><td>${x.type}</td><td>${x.userId}</td><td>UGX ${money(x.amount)}</td><td>${new Date(x.createdAt).toLocaleString()}</td></tr>`).join('')}</table></div></div>`}async function referrals(){const a=await api('/api/admin/referrals');$('page').innerHTML=`<div class="panel"><h2>Referrals</h2>${stat(a.commissions,'Commission Records')}${stat('UGX '+money(a.total),'Referral Commissions Paid')}<p class="muted">Level 1: 10% · Level 2: 0% · Level 3: 0%</p></div>`}
async function settings(){const s=await api('/api/admin/settings');$('page').innerHTML=`<div class="panel"><h2>General Settings</h2><label>Welcome Bonus</label><input id="welcomeBonus" class="input" value="${s.welcomeBonus}"><label>Daily Check-in</label><input id="dailyCheckin" class="input" value="${s.dailyCheckin}"><label>Minimum Top-up</label><input id="minTopup" class="input" value="${s.minTopup}"><label>Minimum Withdrawal</label><input id="minWithdrawal" class="input" value="${s.minWithdrawal}"><label>Withdrawal Fee %</label><input id="withdrawalFee" class="input" value="${s.withdrawalFee}"><label>Withdrawal Hours</label><input id="withdrawalHours" class="input" value="${s.withdrawalHours}"><label>Level 1 Commission %</label><input id="level1Commission" class="input" value="${s.level1Commission}"><label>Support</label><input id="support" class="input" value="${s.support||'@Grandcrown01'}"><label>Telegram</label><input id="telegram" class="input" value="${s.telegram||'https://t.me/+zNDnaz_xKfdiMTlk'}"><button class="btn primary" onclick="saveGeneral()">Save Changes</button></div><div class="panel"><h2>Payment Settings</h2><div class="notice"><b>Payment Method:</b> PesaJet<br><b>Checkout:</b> ${s.paymentUrl}</div><p class="muted">Customers see a payment popup; the full checkout link is not displayed as the payment method.</p><button class="btn primary" onclick="savePayment()">Save Payment Settings</button></div>`}async function saveGeneral(){await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({welcomeBonus:Number($('welcomeBonus').value),dailyCheckin:Number($('dailyCheckin').value),minTopup:Number($('minTopup').value),minWithdrawal:Number($('minWithdrawal').value),withdrawalFee:Number($('withdrawalFee').value),withdrawalHours:$('withdrawalHours').value,level1Commission:Number($('level1Commission').value),support:$('support').value,telegram:$('telegram').value})});alert('Settings saved')}async function savePayment(){await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentMethod:'PesaJet',paymentUrl:'https://pay.pesajet.com/pay/d9c18ef87c'})});alert('PesaJet settings saved')} 
</script></body></html>
