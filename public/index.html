<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061b35"><title>Grand Crown</title><style>
:root{--navy:#061b35;--navy2:#0b2c55;--card:#0c2a50;--gold:#e2b84b;--gold2:#f4d77c;--line:#31577f;--text:#f5f8fc;--muted:#b9c8d9;--green:#13b66b;--red:#ef4b4b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#061b35,#071f3c);color:var(--text);font-family:Inter,Arial,sans-serif;padding-bottom:82px}.app{max-width:720px;margin:auto}.top{position:sticky;top:0;z-index:10;background:#08264b;border-bottom:2px solid var(--gold);padding:13px 18px}.topline{display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:900;letter-spacing:.4px;color:var(--gold2)}.welcome{color:#bcd0e7;margin-top:2px;font-size:14px}.iconbtn{width:38px;height:38px;border:1px solid #4a6b90;border-radius:11px;background:#102f58;color:#fff;font-size:20px}.page{padding:14px}.card{background:linear-gradient(145deg,#0d2f59,#092344);border:1px solid #355c86;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 20px #0002}.hero{background:linear-gradient(145deg,#0b315b,#061b35);overflow:hidden}.hero h1{font-size:28px;margin:0 0 7px;color:#fff}.hero p{color:var(--muted);line-height:1.45}.gold{color:var(--gold2)}.wallet{background:linear-gradient(135deg,#5b4314,#e1b94f 55%,#9d7420);color:#081a31;border:0}.wallet .small{opacity:.85}.wallet .amount{font-size:30px;font-weight:900;margin:4px 0 12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-size:14px;background:var(--gold);color:#071a30;cursor:pointer}.btn.dark{background:#12375f;color:#fff;border:1px solid #4b6e94}.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.full{width:100%}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{border:1px solid #3d638b;background:#0b2a50;color:#fff;border-radius:14px;padding:11px 5px;font-size:11px}.quick b{display:block;font-size:21px;color:var(--gold2);margin-bottom:4px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#09264a;border:1px solid #31567f;border-radius:14px;padding:14px}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:20px;font-weight:900;color:var(--gold2);margin-top:5px}.checkin{display:flex;justify-content:space-between;align-items:center;background:#12355e;border:1px solid #476b92;border-radius:15px;padding:13px}.checkin strong{color:var(--gold2)}.product{background:#0b2a50;border:1px solid #3a638d;border-radius:17px;padding:14px;margin:10px 0}.product .title{font-size:18px;font-weight:900}.product .price{font-size:18px;color:var(--gold2);font-weight:900;margin:4px 0 8px}.product .meta{color:#d5e0ed;line-height:1.55;font-size:13px}.product .buy{margin-top:10px}.tag{display:inline-block;border-radius:20px;padding:4px 8px;font-size:11px;background:#14365d;color:#d6e5f4}.section-title{display:flex;justify-content:space-between;align-items:center}.section-title h2{margin:0}.muted{color:var(--muted)}.input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #557392;background:#f7f9fc;color:#13233a;margin:7px 0 11px;font-size:15px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#06152b;border-top:1px solid var(--gold);display:grid;grid-template-columns:repeat(6,1fr);padding:8px 2px calc(8px + env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:#b7c7d8;font-size:10px;padding:4px 1px}.nav button span{display:block;font-size:20px;line-height:22px;margin-bottom:3px}.nav button.active{color:var(--gold2)}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:50}.modal.hide{display:none}.sheet{width:min(720px,100%);background:#f8fafc;color:#142238;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}.sheet h2{margin:0 0 6px}.paybox{border:1px solid #d8dee7;border-radius:15px;padding:14px;background:#fff}.paybrand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;color:#1772c8}.close{float:right;background:none;border:0;font-size:24px;color:#455}.empty{text-align:center;color:var(--muted);padding:20px}.auth{min-height:100vh;display:flex;align-items:center;padding:18px}.authcard{width:100%;background:#0b2b54;border:1px solid #3d638b;border-radius:25px;padding:22px;box-shadow:0 20px 45px #0005}.authbrand{text-align:center;font-size:31px;color:var(--gold2);font-weight:900}.hide{display:none!important}@media(min-width:650px){body{padding-bottom:0}.nav{position:sticky;bottom:auto;top:0;border:1px solid #2f5278;border-radius:15px;margin:10px auto;max-width:720px}.page{padding:18px}.quick{gap:12px}}
</style></head><body><div class="app">
<div id="auth" class="auth"><div class="authcard"><div class="authbrand">♛ GRAND CROWN</div><p style="text-align:center" class="muted">HOTEL & SUITES · Luxury stays. Lasting rewards.</p><input id="phone" class="input" placeholder="Phone number"><input id="password" class="input" type="password" placeholder="Password (8+ characters)"><input id="refCode" class="input" placeholder="Referral code (optional)"><div class="actions"><button class="btn" onclick="register()">Create Account</button><button class="btn dark" onclick="login()">Sign In</button></div><p id="authMsg" class="muted"></p></div></div>
<div id="app" class="hide"><header class="top"><div class="topline"><div><div class="brand">♛ GRAND CROWN</div><div class="welcome" id="welcome">Welcome</div></div><button class="iconbtn" onclick="refreshAll()">↻</button></div></header>
<main id="content"></main><nav class="nav"><button onclick="tab('home')"><span>⌂</span>Home</button><button onclick="tab('products')"><span>▣</span>Products</button><button onclick="tab('myproducts')"><span>▤</span>My Products</button><button onclick="tab('referral')"><span>↗</span>Referral</button><button onclick="tab('team')"><span>♟</span>Team</button><button onclick="tab('account')"><span>●</span>Account</button></nav></div></div>
<div id="payModal" class="modal hide"><div class="sheet"><button class="close" onclick="closePay()">×</button><h2>Deposit</h2><p class="muted">Choose a payment method and enter your transaction reference.</p><div class="paybox"><div class="paybrand">◉ PesaJet <span class="tag">Recommended</span></div><p>1. Open PesaJet below.<br>2. Complete your payment.<br>3. Return here and enter your reference.<br>4. Wait for admin approval.</p><button class="btn full" onclick="openPesaJet()">Open PesaJet</button><input id="payPhone" class="input" placeholder="Phone used to pay"><input id="payTx" class="input" placeholder="Transaction reference"><button class="btn dark full" onclick="submitPayment()">Submit for Approval</button><p id="payMsg" class="muted"></p></div></div></div>
<script>
let me=null,products=[],selected=null;const $=id=>document.getElementById(id),money=n=>'UGX '+Number(n||0).toLocaleString();async function api(u,o={}){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw d;return d}
async function register(){try{const d=await api('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:$('phone').value,password:$('password').value,referralCode:$('refCode').value})});me=d.user;showApp()}catch(e){$('authMsg').textContent=e.error||'Registration failed'}}async function login(){try{const d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:$('phone').value,password:$('password').value})});me=d.user;showApp()}catch(e){$('authMsg').textContent=e.error||'Login failed'}}async function boot(){try{const ref=new URLSearchParams(location.search).get('ref');if(ref)$('refCode').value=ref;const d=await api('/api/me');if(d.loggedIn){me=d.user;showApp()}}catch{}}async function showApp(){$('auth').classList.add('hide');$('app').classList.remove('hide');await refreshAll();tab('home')}async function refreshAll(){const [d,p,r,w]=await Promise.all([api('/api/dashboard'),api('/api/products'),api('/api/referral'),api('/api/withdrawals')]);me=d.user;products=p;window.state={d,r,w};render();}
function tab(n){window.current=n;render()}function render(){const n=window.current||'home',d=window.state?.d||{user:me,purchases:[]},r=window.state?.r||{},w=window.state?.w||[];$('welcome').textContent='Welcome, '+(d.user?.phone||'Member');document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',['home','products','myproducts','referral','team','account'][i]===n));let html='';if(n==='home')html=home(d);if(n==='products')html=productsPage();if(n==='myproducts')html=myProducts(d);if(n==='referral')html=referral(r);if(n==='team')html=team(r);if(n==='account')html=account(d,w);$('content').innerHTML=html}
function home(d){return `<section class="page"><div class="card hero"><h1>Welcome to Grand Crown</h1><p>Luxury stays, exclusive room packages and member rewards in one place.</p></div><div class="card wallet"><div class="small">Wallet Balance</div><div class="amount">${money(d.user.wallet)}</div><div class="actions"><button class="btn" onclick="tab('products')">Deposit</button><button class="btn dark" onclick="tab('account')">Withdraw</button></div></div><div class="quick"><button onclick="tab('products')"><b>▣</b>Products</button><button onclick="tab('myproducts')"><b>▤</b>My Products</button><button onclick="tab('referral')"><b>↗</b>Referral</button><button onclick="tab('team')"><b>♟</b>Team</button></div><div class="card checkin"><div>🎁 <strong>Daily Check-in</strong><div class="muted">Get UGX 100</div></div><button class="btn" onclick="checkin()">Check In</button></div><div class="stats"><div class="stat"><div class="label">Welcome Bonus</div><div class="value">UGX 2,100</div></div><div class="stat"><div class="label">Total Earned</div><div class="value">${money(d.user.totalEarned)}</div></div><div class="stat"><div class="label">Active Products</div><div class="value">${d.purchases.length}</div></div><div class="stat"><div class="label">Withdrawal</div><div class="value">${d.purchases.length?'Active':'Locked'}</div></div></div><div class="card"><div class="section-title"><h2>Hot Offers</h2><button class="btn dark" onclick="tab('products')">View All</button></div><p class="muted">Room packages from ${money(Math.min(...products.map(x=>x.price||Infinity)))}</p></div></section>`}
function productsPage(){return `<section class="page"><div class="card"><div class="section-title"><h2>Room Packages</h2><span class="tag">PesaJet</span></div><p class="muted">Choose a room plan and start your journey today.</p>${products.map(p=>`<div class="product"><div class="title">${p.name}</div><div class="price">${money(p.price)}</div><div class="meta">Daily: ${money(p.daily)}<br>Total: ${money(p.total)}<br>Validity: ${p.days} days</div><button class="btn buy" onclick="openPay('${p.id}')">Buy with PesaJet</button></div>`).join('')}</div></section>`}
function myProducts(d){return `<section class="page"><div class="card"><h2>My Products</h2>${d.purchases.length?d.purchases.map(p=>{const prod=products.find(x=>String(x.id)===String(p.productId));return `<div class="product"><div class="title">${p.productName}</div><span class="tag">${p.status}</span><div class="meta">Investment: ${money(p.amount)}<br>Daily: ${money(prod?.daily||0)}<br>Earned so far: ${money(p.earningsCredited||0)}</div></div>`}).join(''):'<div class="empty">No purchased products yet.</div>'}</div></section>`}
function referral(r){return `<section class="page"><div class="card"><h2>Referral</h2><p class="muted">Your referral code</p><div class="wallet" style="padding:12px;border-radius:14px"><b style="font-size:22px">${r.code||'—'}</b><button class="btn" style="float:right" onclick="copyText('${r.code||''}')">Copy</button></div><p class="muted">Your Referral Link</p><div class="notice" style="word-break:break-all">${r.link||''}</div><div class="stats" style="margin-top:10px"><div class="stat"><div class="label">Direct Referrals</div><div class="value">${r.directReferrals||0}</div></div><div class="stat"><div class="label">Team Size</div><div class="value">${r.teamSize||0}</div></div></div><p><b>Commission:</b> 10% Level 1 only</p><button class="btn full" onclick="copyText('${r.link||''}')">Invite Friends</button></div></section>`}
function team(r){return `<section class="page"><div class="card"><h2>My Team</h2><p class="muted">Your team members and their levels.</p>${(r.members||[]).map(x=>`<div class="product"><b>Level ${x.level}</b><br>${x.phone}<br><span class="muted">Joined ${new Date(x.createdAt).toLocaleDateString()}</span></div>`).join('')||'<div class="empty">No team members yet.</div>'}</div></section>`}
function account(d,w){return `<section class="page"><div class="card"><h2>Account</h2><p>Phone: <b>${d.user.phone}</b></p><p>Account ID: <b>${d.user.id}</b></p><p>Referral code: <b>${d.user.referralCode}</b></p></div><div class="card"><h2>Withdraw</h2><p>Purchase at least 1 approved product to activate withdrawals.</p><p>Minimum: <b>UGX 3,000</b> · Fee: <b>12%</b> · Hours: <b>10:00–17:00 EAT</b></p><input id="wdAmount" class="input" type="number" placeholder="Amount"><select id="wdMethod" class="input"><option>Airtel Money</option><option>MTN Mobile Money</option></select><input id="wdPhone" class="input" placeholder="Mobile-money number"><button class="btn" onclick="withdraw()">Request Withdrawal</button><p id="wdMsg" class="muted"></p></div><div class="card"><h2>Withdrawal history</h2>${w.length?w.map(x=>`<div class="product"><b>${money(x.amount)}</b> · ${x.status}<br><span class="muted">${new Date(x.createdAt).toLocaleString()}</span></div>`).join(''):'<div class="empty">No withdrawal requests.</div>'}</div><button class="btn dark full" onclick="logout()">Log Out</button></section>`}
function openPay(id){selected=products.find(p=>String(p.id)===String(id));$('payMsg').textContent='';$('payPhone').value='';$('payTx').value='';$('payModal').classList.remove('hide')}function closePay(){$('payModal').classList.add('hide')}function openPesaJet(){window.open('https://pay.pesajet.com/pay/d9c18ef87c','_blank','noopener')}async function submitPayment(){try{const d=await api('/api/payments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:selected.id,method:'PesaJet',amount:selected.price,payerPhone:$('payPhone').value,transactionId:$('payTx').value})});$('payMsg').textContent='Submitted successfully. Payment is pending admin approval.';setTimeout(closePay,1400);refreshAll()}catch(e){$('payMsg').textContent=e.error||'Payment failed'}}async function checkin(){try{const d=await api('/api/checkin',{method:'POST'});me=d.user;await refreshAll()}catch(e){alert(e.error||'Check-in unavailable')}}async function withdraw(){try{const d=await api('/api/withdrawals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:Number($('wdAmount').value),method:$('wdMethod').value,phone:$('wdPhone').value})});$('wdMsg').textContent='Withdrawal request submitted.';refreshAll()}catch(e){$('wdMsg').textContent=e.error||'Withdrawal failed'}}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}async function copyText(t){try{await navigator.clipboard.writeText(t);alert('Copied')}catch{}}boot();
</script></body></html>
